[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "proximity-isomap"
version = "0.1.0"
description = "Research baselines for region-based proximity graphs and disconnected manifold embeddings"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26,<3",
    "scipy>=1.11,<2",
]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Mathematics",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.8,<1"]
docs = ["sphinx>=8,<10", "myst-parser>=4,<5", "furo>=2024.8.6"]
experiments = ["scikit-learn>=1.4,<2", "matplotlib>=3.8,<4"]

[tool.hatch.build.targets.wheel]
packages = ["src/proximity_isomap"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
