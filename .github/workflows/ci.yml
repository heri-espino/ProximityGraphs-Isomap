name: CI

on:
  push:
  pull_request:

jobs:
  test-and-docs:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install editable project
        run: python -m pip install -e ".[dev,docs,experiments]"
      - name: Run tests
        run: python -m pytest -q
      - name: Lint
        run: python -m ruff check src tests examples scripts proximity_isomap/code
      - name: Validate research and literature integrity
        run: |
          python scripts/validate_research.py
          python scripts/validate_experiment_archive.py
      - name: Enforce journal and handoff updates on PRs
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: python scripts/check_change_protocol.py --base "origin/$BASE_REF"
      - name: Smoke all eight rebuilt experiments (ContrastColors)
        run: |
          python -m pip install "contrastcolors @ git+https://github.com/heri-espino/Colors.git@84e05b40b6ba6aa6864f5bc13ad43da3c4c1e93d"
          python proximity_isomap/code/research_runner.py --quick --seed 20261018 --label ci-${{ github.run_id }}-smoke
      - name: Smoke EXP-009 topology pilot
        run: python proximity_isomap/code/009-topological_manifolds/run.py --output /tmp/exp009-ci-${{ github.run_id }}
      - name: Build API documentation
        run: python -m sphinx -b html -W docs docs/_build/html
