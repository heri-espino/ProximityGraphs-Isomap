name: CI

on:
  push:
  pull_request:

jobs:
  test-and-docs:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install editable project
        run: python -m pip install -e ".[dev,docs]"
      - name: Run tests
        run: python -m pytest -q
      - name: Lint
        run: python -m ruff check src tests examples experiments scripts
      - name: Validate research and literature integrity
        run: python scripts/validate_research.py
      - name: Enforce journal and handoff updates on PRs
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: python scripts/check_change_protocol.py --base "origin/$BASE_REF"
      - name: Build API documentation
        run: python -m sphinx -b html -W docs docs/_build/html
